        const processImageToBase64 = (file, maxWidth = 800) => {
            return new Promise((resolve, reject) => {
                if (!file) return reject(new Error("No file selected"));
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                        resolve(dataUrl);
                    };
                    img.onerror = () => reject(new Error("Invalid image file"));
                    img.src = event.target.result;
                };
                reader.onerror = () => reject(new Error("Failed to read file"));
                reader.readAsDataURL(file);
            });

            const roll = Math.random() * 100;
            let targetRarity = 'Common';
            if (tierLevel === 'mythic') {
                if (roll < 35) targetRarity = 'Mythic';
                else if (roll < 80) targetRarity = 'Legendary';
                else targetRarity = 'Epic';
            } else if (tierLevel === 'golden') {
                if (roll < 12) targetRarity = 'Mythic';
                else if (roll < 42) targetRarity = 'Legendary';
                else if (roll < 80) targetRarity = 'Epic';
                else targetRarity = 'Rare';
            } else {
                if (roll < 6) targetRarity = 'Mythic';
                else if (roll < 20) targetRarity = 'Legendary';
                else if (roll < 45) targetRarity = 'Epic';
                else if (roll < 75) targetRarity = 'Rare';
                else targetRarity = 'Common';
            }
            const pool = CHEM_REWARD_CARDS.filter(c => c.rarity === targetRarity);
            const fallbackPool = pool.length > 0 ? pool : CHEM_REWARD_CARDS;
            return fallbackPool[Math.floor(Math.random() * fallbackPool.length)];
        };

        // Rich Text Editor Toolbar Component (Bold, Italic, Underline, Align, Indent)
        function RichTextEditor({ value, onChange, placeholder }) {
            const editorRef = useRef(null);

            useEffect(() => {
                if (editorRef.current && editorRef.current.innerHTML !== (value || '')) {
                    editorRef.current.innerHTML = value || '';
                }
            }, [value]);

            const execCmd = (cmd, arg = null) => {
                if (!editorRef.current) return;
                editorRef.current.focus();
                document.execCommand(cmd, false, arg);
                onChange(editorRef.current.innerHTML);
            };

            return (
                <div className="border border-slate-300 dark:border-slate-600 rounded-xl overflow-hidden bg-white dark:bg-slate-800">
                    <div className="flex flex-wrap gap-1 p-2 bg-slate-100 dark:bg-slate-700 border-b border-slate-300 dark:border-slate-600 text-xs font-bold">
                        <button type="button" onClick={() => execCmd('bold')} className="px-2.5 py-1 rounded bg-white dark:bg-slate-600 hover:bg-slate-50 border border-slate-300 dark:border-slate-500" title="Bold"><b>B</b></button>
                        <button type="button" onClick={() => execCmd('italic')} className="px-2.5 py-1 rounded bg-white dark:bg-slate-600 hover:bg-slate-50 border border-slate-300 dark:border-slate-500 italic" title="Italic"><i>I</i></button>
                        <button type="button" onClick={() => execCmd('underline')} className="px-2.5 py-1 rounded bg-white dark:bg-slate-600 hover:bg-slate-50 border border-slate-300 dark:border-slate-500 underline" title="Underline">U</button>
                        <span className="border-r border-slate-300 dark:border-slate-500 mx-1"></span>
                        <button type="button" onClick={() => execCmd('justifyLeft')} className="px-2.5 py-1 rounded bg-white dark:bg-slate-600 hover:bg-slate-50 border border-slate-300 dark:border-slate-500" title="Align Left">⇤ Left</button>
                        <button type="button" onClick={() => execCmd('justifyCenter')} className="px-2.5 py-1 rounded bg-white dark:bg-slate-600 hover:bg-slate-50 border border-slate-300 dark:border-slate-500" title="Align Center">Center</button>
                        <button type="button" onClick={() => execCmd('justifyRight')} className="px-2.5 py-1 rounded bg-white dark:bg-slate-600 hover:bg-slate-50 border border-slate-300 dark:border-slate-500" title="Align Right">Right ⇥</button>
                        <span className="border-r border-slate-300 dark:border-slate-500 mx-1"></span>
                        <button type="button" onClick={() => execCmd('indent')} className="px-2.5 py-1 rounded bg-white dark:bg-slate-600 hover:bg-slate-50 border border-slate-300 dark:border-slate-500" title="Indent">» Indent</button>
                        <button type="button" onClick={() => execCmd('outdent')} className="px-2.5 py-1 rounded bg-white dark:bg-slate-600 hover:bg-slate-50 border border-slate-300 dark:border-slate-500" title="Outdent">« Outdent</button>
                    </div>
                    <div
                        ref={editorRef}
                        contentEditable
                        onInput={(e) => onChange(e.currentTarget.innerHTML)}
                        placeholder={placeholder}
                        className="p-3 min-h-[85px] outline-none text-sm text-slate-800 dark:text-slate-100 max-w-none"
                    />
                </div>
            );

                const newOrder = [...orderedChapterIds];
                const [removed] = newOrder.splice(idx, 1);

            const toggleVoiceRecording = async (chapterToUse) => {

                        mediaRecorderRef.current.stop();
                    }
                    setIsRecordingVoice(false);
                    if (recordingTimerRef.current) clearInterval(recordingTimerRef.current);
                    return;
                }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioChunksRef.current = [];
                    const recorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = recorder;

                    recorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunksRef.current.push(event.data);
                    };

                    recorder.onstop = () => {
                        stream.getTracks().forEach(t => t.stop());
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        if (audioBlob.size > 950 * 1024) {
                            showToast("Voice clip too long! Please keep voice messages under 45 seconds.");
                            return;
                        }
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result;
                            // Store in preview state so user can listen before sending!
                            setVoicePreview({
                                audioDataUrl: base64Audio,
                                durationSec: recordingSeconds || 1,
                                chapterNum: chapterToUse
                            });
                            showToast("Recording stopped! Listen to your preview below before sending.");
                        };

                    setVoicePreview(null);
                    setRecordingSeconds(0);

                            </div>

                            <div className="space-y-6">
                                <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-[#E6DEC8] dark:border-slate-700 p-6">
                                    <h3 className="text-lg font-extrabold mb-4 border-b border-slate-100 dark:border-slate-700 pb-3">
                                        📄 Chapter Study Notes
                                    </h3>
                                    {visibleNotes.length === 0 ? (
                                        <p className="text-xs text-slate-400 py-4">No PDF notes uploaded for this chapter yet.</p>
                                    ) : (
                                        <div className="space-y-2.5">
                                            {visibleNotes.map((nt, nIdx) => (
                                                <a
                                                    key={nIdx}
                                                    href={nt.url}
                                                    target="_blank"
                                                    rel="noreferrer"
                                                    className="w-full flex items-center justify-between p-3.5 rounded-xl bg-[#FAF7F2] dark:bg-slate-700 hover:bg-amber-50 border border-[#E6DEC8] dark:border-slate-600 transition group"
                                                >
                                                    <div>
                                                        <span className="text-xs font-bold text-slate-800 dark:text-white group-hover:text-amber-600 transition block">
                                                            {nt.title || `Chapter ${chapterPos} Notes`}
                                                        </span>
                                                        {nt.tier === 'pro' && <span className="text-[10px] uppercase text-amber-600 font-bold">Pro Note</span>}
                                                    </div>
                                                    <span className="text-xs font-bold text-amber-600">Download →</span>
                                                </a>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="bg-white dark:bg-slate-800 rounded-2xl border border-[#E6DEC8] dark:border-slate-700 p-6">
                                    <span className="text-xs font-bold uppercase text-amber-600">Subscription Plan</span>
                                    <h4 className="text-lg font-extrabold mt-1 mb-2">Current Tier: <span className="uppercase text-amber-600">{effectiveTier}</span></h4>
                                    <p className="text-xs text-slate-500 dark:text-slate-300 leading-relaxed mb-4">
                                        View all subscription plans and pricing details anytime.
                                    </p>
                                    <button
                                        onClick={() => setShowPlansOverlay(true)}
                                        className="w-full py-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold uppercase tracking-wider transition"
                                    >
                                        View Plans & Pricing
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // 5. MAIN STUDENT DASHBOARD (Displays Dynamic Ordered Chapters & Prominent Reward Center)
            const rankInfo = getStudentRank(userData?.xp || 0);
            const effectiveTier = getEffectiveTier();

            return (
                <div className="min-h-screen bg-[#FAF7F2] dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors">
                    <ToastUI />
                    <RewardModalUI />
                    <LabVaultModalUI />
                    {showPlansOverlay && (
                        <div className="fixed inset-0 z-50 bg-[#FAF7F2]/95 dark:bg-slate-900/95 backdrop-blur-sm overflow-y-auto p-4 md:p-8">
                            <SubscriptionPlans isOverlay={true} />
                        </div>
                    )}

                    {/* Top Navigation */}
                    <header className="sticky top-0 z-30 backdrop-blur-md bg-white/85 dark:bg-slate-900/85 border-b border-[#E6DEC8] dark:border-slate-800 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <span className="w-9 h-9 rounded-xl bg-amber-600 text-white flex items-center justify-center font-bold">🧪</span>
                                <span className="text-xl font-extrabold text-slate-900 dark:text-white">
                                    Hayden Chem Tutor
                                </span>
                                <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-amber-100 text-amber-800">
                                    {effectiveTier}
                                </span>
                            </div>

                            <div className="flex flex-wrap items-center gap-2.5">
                                <button
                                    onClick={() => { setVaultTab('collection'); setShowVaultModal(true); }}
                                    className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-sm"
                                >
                                    <span>{rankInfo.icon} {rankInfo.title}</span>
                                    <span>• ⚡ {userData?.xp || 0}</span>
                                    <span>• 💎 {userData?.gems || 0}</span>
                                </button>
                                <button
                                    onClick={() => { setVaultTab('chests'); setShowVaultModal(true); }}
                                    className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow-sm"
                                >
                                    🎁 Open Chests
                                </button>
                                <button onClick={() => setShowPlansOverlay(true)} className="px-3.5 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-xs font-bold transition">
                                    Plans & Pricing
                                </button>
                                <button onClick={toggleDarkMode} className="p-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl">
                                    {isDarkMode ? '☀️' : '🌙'}
                                </button>
                                {user.email === ADMIN_EMAIL && (
                                    <button onClick={() => setView('admin')} className="px-4 py-2 bg-slate-900 text-amber-400 rounded-xl text-xs font-bold transition">
                                        Admin Panel
                                    </button>
                                )}
                                <button onClick={handleLogout} className="px-4 py-2 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold transition">
                                    Sign Out
                                </button>
                            </div>
                        </div>
                    </header>
                    
                    <div className="max-w-7xl mx-auto p-6 md:p-10">
                        <div className="flex flex-col md:flex-row items-start md:items-center justify-between mb-8 gap-4 bg-white dark:bg-slate-800 p-6 rounded-2xl border border-[#E6DEC8] dark:border-slate-700 shadow-sm">
                            <div>
                                <span className="text-xs font-bold uppercase text-amber-600 block mb-1">Welcome, {user.email}</span>
                                <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 dark:text-white">
                                    Course Chapters ({orderedChapterIds.length} Modules)
                                </h2>
                            </div>
                            
                            <div
                                onClick={() => { setVaultTab('quests'); setShowVaultModal(true); }}
                                className="bg-[#FAF7F2] dark:bg-slate-700 px-5 py-3 rounded-xl border border-[#E6DEC8] dark:border-slate-600 flex items-center gap-4 cursor-pointer hover:border-amber-600 transition"
                            >
                                <span className="text-xs font-extrabold text-orange-600">🔥 {userData?.streak || 1}d Streak</span>
                                <div className="w-28 h-2.5 bg-slate-200 dark:bg-slate-600 rounded-full overflow-hidden">
                                    <div className="h-full bg-emerald-500" style={{ width: `${Math.min(100, Math.round(((userData?.completedVideos?.length || 0) / Math.max(1, orderedChapterIds.length)) * 100))}%` }}></div>
                                </div>
                                <span className="text-xs font-extrabold text-slate-800 dark:text-white">
                                    🃏 {(userData?.unlockedCards || []).length} / {CHEM_REWARD_CARDS.length} Relics
                                </span>
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            {orderedChapterIds.map((chapId, idx) => {
                                const displayNum = idx + 1;
                                const chapterData = chapters[chapId];
                                const hasContent = chapterData?.videoUrl || chapterData?.videos?.length > 0 || chapterData?.notesUrl || chapterData?.notes?.length > 0;
                                
                                return (
                                    <div
                                        key={chapId}
                                        onClick={() => { setSelectedVideoIndex(0); setActiveChapter(chapId); setView('chapter'); }}
                                        className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-[#E6DEC8] dark:border-slate-700 hover:border-amber-600 hover:-translate-y-1 cursor-pointer transition-all flex items-center gap-4 group relative"
                                    >
                                        {hasContent && <div className="absolute top-3.5 right-3.5 w-2.5 h-2.5 bg-emerald-500 rounded-full" title="Content Available"></div>}
                                        <div className="w-12 h-12 bg-amber-50 dark:bg-slate-700 rounded-xl flex items-center justify-center flex-shrink-0 group-hover:bg-amber-600 transition border border-amber-200 dark:border-slate-600">
                                            <span className="font-extrabold text-amber-800 dark:text-white group-hover:text-white text-base">{displayNum}</span>
                                        </div>
                                        <div className="overflow-hidden">
                                            <span className="text-[11px] uppercase font-bold text-amber-600 block">Chapter {displayNum}</span>
                                            <h3 className="font-bold text-slate-900 dark:text-white text-sm leading-snug truncate">
                                                {chapterData?.title || `Chapter ${displayNum}`}
                                            </h3>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
